# Alembic configuration for MarketPulse AI (blueprint Phase 1, ADR-0023).
#
# IMPORTANT: migrations run against the DIRECT (non-pooled) connection, connected as the
# project owner role, NOT the application role. PgBouncer transaction mode (Neon pooled)
# breaks session-level state that DDL and some SET operations rely on. See ADR-0022/0023.
#
# The actual URL is resolved at runtime by migrations/env.py from MP_DATABASE_DIRECT_URL
# (falling back to MP_DATABASE_URL if the direct URL is not set, for local parity).

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url =

# Logging: quiet by default. The env.py module configures logging explicitly.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
